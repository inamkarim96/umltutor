apiVersion: apps/v1
kind: Deployment
metadata:
  name: umltutor-frontend
  namespace: umltutor
  labels:
    app: umltutor-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umltutor-frontend
  template:
    metadata:
      labels:
        app: umltutor-frontend
    spec:
      containers:
        - name: frontend
          image: inamkarim/umltutor-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: umltutor-frontend
  namespace: umltutor
spec:
  selector:
    app: umltutor-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
