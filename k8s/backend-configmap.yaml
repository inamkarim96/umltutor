apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: umltutor
data:
  NODE_ENV: "production"
  PORT: "3000"
  JWT_EXPIRES_IN: "7d"
  CLIENT_URL: "http://localhost"
  LOG_LEVEL: "info"
  UPLOAD_DIR: "uploads"
  DATABASE_URL: "postgresql://umltutor:5180@postgres:5439/umltutor?schema=public"
