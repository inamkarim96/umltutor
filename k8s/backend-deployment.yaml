apiVersion: apps/v1
kind: Deployment
metadata:
  name: umltutor-backend
  namespace: umltutor
  labels:
    app: umltutor-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: umltutor-backend
  template:
    metadata:
      labels:
        app: umltutor-backend
    spec:
      containers:
        - name: backend
          image: inamkarim/umltutor-backend:latest
          imagePullPolicy: Always
          command: ["node", "src/server.js"]
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: JWT_SECRET
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: umltutor-backend
  namespace: umltutor
spec:
  selector:
    app: umltutor-backend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
