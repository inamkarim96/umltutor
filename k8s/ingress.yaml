apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umltutor-ingress
  namespace: umltutor
  annotations:
    # Removed rewrite-target so the backend receives the full path (which it expects)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # WebSocket headers are now handled by the proxy-http-version and individual path settings if needed
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # Route API traffic to backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: umltutor-backend
                port:
                  number: 3000
          # Route Socket.IO to backend
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: umltutor-backend
                port:
                  number: 3000
          # Route everything else to frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: umltutor-frontend
                port:
                  number: 80
