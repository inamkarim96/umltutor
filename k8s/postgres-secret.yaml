apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: umltutor
type: Opaque
# Values are base64 encoded. To encode: echo -n "your-value" | base64
# umltutor      → dW1sdHV0b3I=
# umltutor_pass → dW1sdHV0b3JfcGFzcw==
# umltutor-secret-key-change-in-production → dW1sdHV0b3Itc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
data:
  POSTGRES_USER: dW1sdHV0b3I=
  POSTGRES_PASSWORD: NTE4MA==
  POSTGRES_DB: dW1sdHV0b3I=
  JWT_SECRET: dW1sdHV0b3Itc2VjcmV0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==
