# Deploy backend and frontend as separate Vercel projects from this monorepo.
# Required GitHub secrets (Settings → Secrets → Actions):
#   VERCEL_TOKEN          — Vercel account token
#   VERCEL_ORG_ID         — Team/user id from Vercel → Settings
#   VERCEL_BACKEND_PROJECT_ID  — umltutor-backend project id
#   VERCEL_FRONTEND_PROJECT_ID — umltutor-frontend project id

name: Vercel Monorepo Deploy

on:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'umltutor-backend/**'
              - 'package-lock.json'
            frontend:
              - 'umltutor-frontend/**'
              - 'package-lock.json'

  deploy-backend:
    name: Deploy umltutor-backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend (Prisma migrate + API)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
          working-directory: umltutor-backend
          vercel-args: '--prod'

  deploy-frontend:
    name: Deploy umltutor-frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy frontend
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
          working-directory: umltutor-frontend
          vercel-args: '--prod'
