# Deploy backend + frontend to separate Vercel projects.
# Uses remote Vercel build (vercel.json install + build) — no local vercel pull/build.
#
# Secrets: VERCEL_TOKEN, VERCEL_ORG_ID,
#          VERCEL_BACKEND_PROJECT_ID, VERCEL_FRONTEND_PROJECT_ID
# Backend Vercel project must have DATABASE_URL (Production).

name: Vercel Monorepo Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'umltutor-frontend/**'
              - 'package-lock.json'

  deploy-backend:
    name: Deploy umltutor-backend
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify GitHub secrets
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_BACKEND_PROJECT_ID != '' }}
        run: |
          missing=0
          [ "$HAS_TOKEN" = "true" ]    || { echo "::error::Missing secret: VERCEL_TOKEN"; missing=1; }
          [ "$HAS_ORG" = "true" ]      || { echo "::error::Missing secret: VERCEL_ORG_ID"; missing=1; }
          [ "$HAS_PROJECT" = "true" ]  || { echo "::error::Missing secret: VERCEL_BACKEND_PROJECT_ID"; missing=1; }
          exit $missing

      - name: Deploy backend (remote build on Vercel)
        working-directory: umltutor-backend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
        run: npx vercel@41 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

  deploy-frontend:
    name: Deploy umltutor-frontend
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify GitHub secrets
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_ORG: ${{ secrets.VERCEL_ORG_ID != '' }}
          HAS_PROJECT: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID != '' }}
        run: |
          missing=0
          [ "$HAS_TOKEN" = "true" ]    || { echo "::error::Missing secret: VERCEL_TOKEN"; missing=1; }
          [ "$HAS_ORG" = "true" ]      || { echo "::error::Missing secret: VERCEL_ORG_ID"; missing=1; }
          [ "$HAS_PROJECT" = "true" ]  || { echo "::error::Missing secret: VERCEL_FRONTEND_PROJECT_ID"; missing=1; }
          exit $missing

      - name: Deploy frontend (remote build on Vercel)
        working-directory: umltutor-frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
        run: npx vercel@41 deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
