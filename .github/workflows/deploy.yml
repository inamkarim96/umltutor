name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and Push Backend
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./umltutor-backend
          push: true
          tags: inamkarim/umltutor-backend:latest
          # Use build-args if needed
          cache-from: type=registry,ref=inamkarim/umltutor-backend:buildcache
          cache-to: type=inline

      # Build and Push Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./umltutor-frontend
          push: true
          tags: inamkarim/umltutor-frontend:latest
          build-args: |
            CYPRESS_INSTALL_BINARY=0
          cache-from: type=registry,ref=inamkarim/umltutor-frontend:buildcache
          cache-to: type=inline
